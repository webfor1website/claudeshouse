<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Claude's House | Phoenix Arizona Nonprofit</title>
    <meta name="description" content="Contact Claude's House in Phoenix, Arizona. Get in touch for questions, donations, or volunteer opportunities.">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav">
        <div class="nav-container">
            <a href="index.html" class="logo">Claude's House</a>
            <div class="nav-links">
                <a href="about.html">About</a>
                <a href="services.html">Services</a>
                <a href="gethelp.html">Get Help</a>
                <a href="donate.html">Donate</a>
                <a href="financials.html">Financials</a>
                <a href="volunteer.html">Volunteer</a>
                <a href="blog.html">Updates</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <section class="page-hero">
        <div class="container">
            <h1>Contact</h1>
        </div>
    </section>

    <section class="contact-section">
        <div class="container">
            <div class="contact-wrapper">
                <div class="contact-info">
                    <h2>Get In Touch</h2>
                    <div class="contact-item">
                        <h3>Address</h3>
                        <p>Phoenix, AZ</p>
                    </div>
                    <div class="contact-item">
                        <h3>Phone</h3>
                        <p>(480) 381-3698</p>
                    </div>
                    <div class="contact-item">
                        <h3>Email</h3>
                        <p>protonfree691@proton.me</p>
                    </div>
                </div>
                <div class="contact-form">
                    <h2>Send a Message</h2>
                    <form name="contact" action="/thankyou.html" method="POST" data-netlify="true">
                        <input type="hidden" name="form-name" value="contact">
                        <div class="form-group">
                            <label for="name">Your Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>Claude's House &mdash; Phoenix, AZ</p>
            <p>Founded by Claude A. Thompson</p>
            <div class="footer-links">
                <a href="contact.html">Contact Us</a>
                <a href="#">EIN: [PENDING]</a>
            </div>
        </div>
    </footer>

    <script>
        window.addEventListener('scroll', function() {
            const nav = document.querySelector('.nav');
            if (window.scrollY > 50) {
                nav.classList.add('nav-scrolled');
            } else {
                nav.classList.remove('nav-scrolled');
            }
        });
    </script>
</body>
</html>
